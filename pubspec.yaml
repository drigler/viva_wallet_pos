name: viva_wallet_pos
description: This is a flutter plugin for Android and iOS integration with Viva Wallet POS Terminal.
version: 0.2.4
homepage: https://github.com/drigler/viva_wallet_pos


environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  lints: ^2.1.1


flutter:
  plugin:
    platforms:
      android:
        package: hr.drigler.viva_wallet_pos
        pluginClass: VivaWalletPosPlugin
      ios:
        pluginClass: VivaWalletPosPlugin


topics:
  - payment
  - checkout
  - pos
  - ecommerce
